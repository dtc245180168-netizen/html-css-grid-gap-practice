<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-gap Property</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành Thuộc tính grid-gap (hoặc gap)</h1>

    <!-- Ví dụ 1: Khoảng cách chung cho cả hàng và cột (20px) -->
    <section>
        <h2>Ví dụ 1: Thiết lập khoảng cách chung (grid-gap: 20px)</h2>
        <div class="grid-container grid-demo-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

    <hr>

    <!-- Ví dụ 2: Khoảng cách hàng và cột khác nhau (30px cho hàng, 10px cho cột) -->
    <section>
        <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
        <div class="grid-container grid-demo-2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>

</body>
</html>
